name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request from a branch in this repository would otherwise run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Test Solidity
        run: forge test -vv

  app:
    name: App (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by app/package.json engines, and the version in
        # .nvmrc. Keep these in sync with both.
        node: ['22', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type-check app
        working-directory: app
        run: npm run typecheck

      - name: Test app
        working-directory: app
        run: npm test

  diagram:
    name: Diagram is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Regenerate and compare
        working-directory: app
        run: |
          npm run diagram
          git diff --exit-code -- ../assets/how-it-works.svg
